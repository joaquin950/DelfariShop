<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DelfariShop | Tienda Online</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            rose: { 50:'#fff1f2', 100:'#ffe4e6', 200:'#fecdd3', 500:'#f43f5e', 600:'#e11d48' },
          },
          fontFamily: {
            display: ['"Playfair Display"', 'serif'],
            body: ['"DM Sans"', 'sans-serif'],
          },
        }
      }
    }
  </script>
</head>

<body class="text-gray-800 antialiased">

  <nav class="sticky top-0 z-40 glass-nav border-b border-rose-100 px-4 md:px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <button onclick="toggleMobileMenu()" class="md:hidden text-gray-700">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
      </button>
      <div class="w-10 h-10 bg-rose-50 rounded-full overflow-hidden border border-rose-100 flex items-center justify-center">
        <img src="assets/logo/logo.png" alt="" class="object-cover w-full h-full">
      </div>
      <span class="font-display text-xl md:text-2xl text-rose-600 font-bold tracking-tighter">DelfariShop</span>
    </div>
    
    <div class="hidden md:flex gap-6 text-sm font-medium text-gray-600">
      <button onclick="filterProducts('todos')" class="hover:text-rose-500 transition">Todos</button>
      <button onclick="filterProducts('pantalones')" class="hover:text-rose-500 transition">Pantalones</button>
      <button onclick="filterProducts('jeans')" class="hover:text-rose-500 transition">Jeans</button>
      <button onclick="filterProducts('abrigos')" class="hover:text-rose-500 transition">Abrigos</button>
    </div>

    <div class="flex items-center gap-4">
      <button onclick="toggleCart()" class="group relative flex items-center gap-2">
        <div class="relative">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-gray-700 group-hover:text-rose-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path d="M15.75 10.5V6a3.75 3.75 0 10-7.5 0v4.5m11.356-1.993l1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 01-1.12-1.243l1.264-12A1.125 1.125 0 015.513 7.5h12.974c.576 0 1.059.435 1.119 1.007z" />
          </svg>
          <span id="cart-count" class="absolute -top-2 -right-2 bg-rose-600 text-white text-[10px] w-5 h-5 rounded-full flex items-center justify-center font-bold hidden">0</span>
        </div>
      </button>
    </div>
  </nav>

  <div id="mobile-menu" class="fixed inset-0 z-[60] hidden">
    <div onclick="toggleMobileMenu()" class="absolute inset-0 bg-black/30 backdrop-blur-sm"></div>
    <div class="absolute top-0 left-0 h-full w-64 bg-white p-6 shadow-xl flex flex-col gap-4">
      <h3 class="font-display text-xl mb-4 border-b pb-2">Categorías</h3>
      <button onclick="filterProducts('todos'); toggleMobileMenu()" class="text-left py-2 hover:text-rose-500">Todos</button>
      <button onclick="filterProducts('pantalones'); toggleMobileMenu()" class="text-left py-2 hover:text-rose-500">Pantalones</button>
      <button onclick="filterProducts('jeans'); toggleMobileMenu()" class="text-left py-2 hover:text-rose-500">Jeans</button>
      <button onclick="filterProducts('calzado'); toggleMobileMenu()" class="text-left py-2 hover:text-rose-500">Calzado</button>
      <button onclick="filterProducts('abrigos'); toggleMobileMenu()" class="text-left py-2 hover:text-rose-500">Abrigos</button>
      <button onclick="filterProducts('remeras'); toggleMobileMenu()" class="text-left py-2 hover:text-rose-500">Remeras</button>
      <button onclick="filterProducts('noche'); toggleMobileMenu()" class="text-left py-2 hover:text-rose-500">Noche</button>
    </div>
  </div>

  <header class="bg-rose-50 py-12 px-6">
    <div class="max-w-7xl mx-auto text-center">
      <h1 class="font-display text-5xl md:text-6xl text-gray-900 mb-4">Esencia <span class="text-rose-500 italic">Femenina.</span></h1>
      <p class="text-gray-600 max-w-md mx-auto mb-8">Colección exclusiva para el local de tu novia.</p>
      <a href="#catalogo" class="inline-block bg-gray-900 text-white px-8 py-3 rounded-full hover:bg-rose-600 transition shadow-lg">Ver Catálogo</a>
    </div>
  </header>

  <main id="catalogo" class="max-w-7xl mx-auto py-16 px-6">
    <div id="products-container" class="grid grid-cols-2 lg:grid-cols-4 gap-4 md:gap-8 transition-all duration-300">
      </div>
  </main>

  <div id="product-detail-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4">
    <div onclick="closeDetail()" class="absolute inset-0 bg-black/70 backdrop-blur-sm"></div>
    <div class="relative bg-white w-full max-w-4xl max-h-[90vh] overflow-y-auto rounded-[2rem] flex flex-col md:flex-row">
      <div class="md:w-1/2 h-80 md:h-auto"><img id="detail-img" src="" class="w-full h-full object-cover"></div>
      <div class="md:w-1/2 p-8 flex flex-col">
        <h2 id="detail-name" class="font-display text-3xl mb-4"></h2>
        <p id="detail-price" class="text-2xl text-rose-600 font-bold mb-6"></p>
        <p id="detail-desc" class="text-gray-600 mb-8"></p>
        <button id="detail-add-btn" class="mt-auto w-full bg-rose-600 text-white py-4 rounded-full font-bold shadow-xl">Añadir al Carrito</button>
      </div>
    </div>
  </div>

  <div id="cart-overlay" onclick="toggleCart()" class="fixed inset-0 bg-black/40 z-40 hidden"></div>
  <aside id="cart-panel" class="fixed top-0 right-0 h-full w-full sm:w-[400px] bg-white z-50 shadow-2xl translate-x-full transition-transform duration-500 flex flex-col">
    <div class="p-6 border-b flex justify-between items-center">
      <h3 class="font-display text-2xl">Mi Pedido</h3>
      <button onclick="toggleCart()" class="text-gray-400">✕</button>
    </div>
    <div id="cart-items" class="flex-1 overflow-y-auto p-6 space-y-4"></div>
    <div class="p-6 bg-rose-50 border-t">
      <div class="flex justify-between mb-6"><span>Total estimado</span><span id="cart-total" class="font-display text-2xl text-rose-600">$0</span></div>
      <a id="wa-cart-btn" target="_blank" class="w-full bg-green-600 text-white py-4 rounded-full font-bold flex items-center justify-center gap-2">Confirmar por WhatsApp</a>
      <button onclick="clearCart()" class="w-full mt-4 text-xs text-gray-400 uppercase tracking-widest">Vaciar carrito</button>
    </div>
  </aside>

  <script src="js/data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
